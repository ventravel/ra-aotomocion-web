<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel de órdenes de reparación | RA Automoción</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/icon-32.png?v=2">
<link rel="stylesheet" href="/assets/style.css?v=9">
<link rel="stylesheet" href="/assets/admin.css?v=1">
</head>
<body>
<header class="site">
  <a class="brand" href="/" aria-label="RA Automoción, inicio">
    <img src="/assets/icon-180.png?v=2" alt="" width="46" height="46">
    <span class="word"><b>RA <em>Automoción</em></b><small>Taller mecánico</small></span>
  </a>
</header>

<main id="contenido">
  <section class="block">
    <div class="wrap wrap-narrow">

      <div id="login-box">
        <h1 class="h2">Panel de órdenes de reparación</h1>
        <label class="campo-nombre">
          Contraseña de administración
          <input type="password" id="input-password">
        </label>
        <button type="button" class="btn btn-primary" id="btn-entrar">Entrar</button>
        <p id="login-error" class="firma-error" hidden>Contraseña incorrecta.</p>
      </div>

      <div id="panel" hidden>
        <h1 class="h2">Nueva orden de reparación</h1>
        <form id="form-nueva-orden">
          <label class="campo-nombre">
            Nombre del cliente
            <input type="text" id="f-cliente" required>
          </label>
          <label class="campo-nombre">
            Teléfono del cliente (para el enlace de WhatsApp)
            <input type="tel" id="f-telefono" placeholder="624482814">
          </label>
          <label class="campo-nombre">
            Vehículo (marca y modelo)
            <input type="text" id="f-vehiculo" required>
          </label>
          <label class="campo-nombre">
            Matrícula
            <input type="text" id="f-matricula">
          </label>
          <label class="campo-nombre">
            PDF de la orden (exportado de CSS)
            <input type="file" id="f-pdf" accept="application/pdf" required>
          </label>
          <p id="orden-error" class="firma-error" hidden></p>
          <button type="submit" class="btn btn-primary" id="btn-crear-orden">Crear orden y generar enlace</button>
        </form>

        <div id="resultado-orden" hidden>
          <p class="section-sub">Enlace de firma generado:</p>
          <p><a id="link-orden-nueva" href="#" target="_blank" rel="noopener"></a></p>
          <a class="btn btn-whatsapp btn-sm" id="link-whatsapp-orden" href="#" target="_blank" rel="noopener">Enviar por WhatsApp</a>
        </div>

        <h2 class="h2">Órdenes</h2>
        <button type="button" class="btn btn-secondary btn-sm" id="btn-refrescar">Actualizar lista</button>
        <table class="tabla-ordenes">
          <thead>
            <tr>
              <th>Fecha</th>
              <th>Cliente</th>
              <th>Vehículo</th>
              <th>Estado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tabla-ordenes-body"></tbody>
        </table>
      </div>

    </div>
  </section>
</main>

<script src="/assets/admin.js?v=1"></script>
</body>
</html>
